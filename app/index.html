<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B4EA2">
<meta name="description" content="Prepara el examen teórico de cualquier permiso de conducir (AM, A1, A2, B, B+E, C, C+E, D, D+E…) con el método del profe: diagnósticos, emboscadas con tus fallos y por qué fallas. App no oficial.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="canonical" href="https://fabrixtep.github.io/PorFinApto/app/">
<style>@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:400;font-display:swap;src:url(../fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:700;font-display:swap;src:url(../fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Overpass";font-style:normal;font-weight:600;font-display:swap;src:url(../fonts/overpass-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Overpass";font-style:normal;font-weight:800;font-display:swap;src:url(../fonts/overpass-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Overpass";font-style:normal;font-weight:900;font-display:swap;src:url(../fonts/overpass-latin-900-normal.woff2) format("woff2")}
@font-face{font-family:"Overpass Mono";font-style:normal;font-weight:500;font-display:swap;src:url(../fonts/overpass-mono-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Overpass Mono";font-style:normal;font-weight:700;font-display:swap;src:url(../fonts/overpass-mono-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Kalam";font-style:normal;font-weight:700;font-display:swap;src:url(../fonts/kalam-latin-700-normal.woff2) format("woff2")}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Por Fin Apto</title>
<style>
/* Concepto: hoja de examen de la DGT corregida en rojo por el profe; señalética vial (azul de indicación, rojo de prohibición, ámbar de obras) como sistema de color. Una columna, barra inferior de pestañas. */
:root{
  --paper:#F1F3F5; --card:#FFFFFF; --ink:#152130; --muted:#586577; --line:#D3D9E0;
  --plate:#0B4EA2; --plate-ink:#FFFFFF; --blue:#0B4EA2; --red:#C42A23; --amber:#C98A00; --amber-l:#F2B705; --green:#1C7A47;
  --soft-blue:#E3EBF6; --soft-red:#FAE6E4; --soft-green:#E1F1E7; --soft-amber:#FCF1CF;
  --signbg:#FFFFFF; --shadow:0 1px 2px rgba(21,33,48,.06), 0 4px 14px rgba(21,33,48,.06);
  --f-display:"Overpass","Arial Narrow",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"Overpass Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-hand:"Kalam","Segoe Print","Bradley Hand","Comic Sans MS","Chalkboard SE",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0F141A; --card:#171E26; --ink:#E6EBF1; --muted:#98A3B2; --line:#29323D;
  --plate:#1A57AE; --plate-ink:#FFFFFF; --blue:#6EA6FF; --red:#FF6E66; --amber:#F2C14E; --amber-l:#F2C14E; --green:#53C78E;
  --soft-blue:#15253B; --soft-red:#371B1B; --soft-green:#13301F; --soft-amber:#352C12;
  --signbg:#E9EDF2; --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); color-scheme:dark; } }
:root[data-theme="dark"]{
  --paper:#0F141A; --card:#171E26; --ink:#E6EBF1; --muted:#98A3B2; --line:#29323D;
  --plate:#1A57AE; --plate-ink:#FFFFFF; --blue:#6EA6FF; --red:#FF6E66; --amber:#F2C14E; --amber-l:#F2C14E; --green:#53C78E;
  --soft-blue:#15253B; --soft-red:#371B1B; --soft-green:#13301F; --soft-amber:#352C12;
  --signbg:#E9EDF2; --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.86rem}
.eyebrow{font-family:var(--f-display);font-weight:800;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.eyebrow.red{color:var(--red)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Cabecera: placa de señal de indicación */
.top{padding-block:14px 6px}
.plate{background:var(--plate);color:var(--plate-ink);border-radius:10px;padding:4px}
.plate-in{border:2.5px solid var(--plate-ink);border-radius:7px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.plate h1{font-weight:900;font-size:1.55rem;letter-spacing:.02em;text-transform:uppercase}
.plate p{font-family:var(--f-display);font-weight:600;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;opacity:.9;text-align:right;white-space:nowrap;line-height:1.35}
.lplate{flex:none;width:34px;height:34px;border-radius:5px;background:var(--plate-ink);color:var(--plate);display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:1.3rem}

main{display:flex;flex-direction:column;gap:16px;padding-block:10px calc(96px + env(safe-area-inset-bottom,0px))}
.vt{font-size:1.6rem;font-weight:900;margin-top:4px}
.lead{max-width:62ch}
.sec{font-size:1.05rem;font-weight:800;margin-top:8px;text-transform:uppercase;letter-spacing:.04em}

/* Botones */
.btn{border:0;border-radius:10px;padding:11px 16px;font-family:var(--f-display);font-weight:800;font-size:.98rem;cursor:pointer;line-height:1.2;text-align:center}
.btn.primary{background:var(--blue);color:var(--card)}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn.big{padding:16px 18px;font-size:1.08rem;width:100%}
.btn.sm{padding:7px 12px;font-size:.86rem}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:not(:disabled):active{transform:translateY(1px)}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.86rem;padding:6px}
.ctas{display:flex;flex-direction:column;gap:10px}

/* Semáforo de aptitud */
.status{display:flex;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.lights{flex:none;background:#1C1F23;border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:7px}
.l{display:block;width:26px;height:26px;border-radius:50%;opacity:.22}
.l.r{background:#FF3B30}.l.a{background:#FFB300}.l.g{background:#2BD46A}
.l.on{opacity:1;box-shadow:0 0 14px 2px currentColor}
.l.r.on{color:#FF3B30}.l.a.on{color:#FFB300}.l.g.on{color:#2BD46A}
.st-txt h2{font-size:1.45rem;font-weight:900;margin:2px 0 4px}
.st-txt p:last-child{color:var(--muted);font-size:.95rem}
.crit{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.crit li{display:flex;gap:10px;align-items:flex-start;font-size:.95rem;color:var(--muted)}
.crit li.ok{color:var(--ink)}
.tick{flex:none;width:20px;height:20px;border-radius:5px;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:800;margin-top:1px}
.crit li.ok .tick{background:var(--green);border-color:var(--green);color:var(--card)}

/* Notas del profe en rotulador rojo */
.hand{font-family:var(--f-hand);font-weight:700;color:var(--red);font-size:1.08rem;line-height:1.35}
.hand.big{font-size:1.25rem}
.note{padding:4px 2px 0;transform:rotate(-.6deg)}
.sig{display:block;font-size:.92rem;margin-top:4px;opacity:.85}

.block{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.bh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.bh h3{font-size:1.02rem;font-weight:800}
.strip{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px}
.cell{height:48px;min-width:0;border-radius:6px;border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:.68rem;color:var(--muted)}
.cell b{font-size:.95rem;color:var(--ink)}
.cell.pass{border:2px solid var(--green);background:var(--soft-green)}
.cell.fail{border:2px solid var(--red);background:var(--soft-red)}
.cell.next{border:2px solid var(--blue);border-style:solid}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stats div{display:flex;flex-direction:column}
.stats b{font-family:var(--f-mono);font-weight:700;font-size:1.5rem;font-variant-numeric:tabular-nums}
.stats span{font-size:.82rem;color:var(--muted);line-height:1.3}
.redt{color:var(--red)}
.datefield{display:flex;flex-direction:column;gap:4px;font-size:.86rem;color:var(--muted)}
.datefield input{font:inherit;font-size:1rem;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:8px;padding:9px 10px;max-width:100%}
.cd{font-size:.98rem}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist li{display:grid;grid-template-columns:1fr auto 56px;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:baseline}
.hist li:first-child{border-top:0}
.hist b{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.hist .pt{color:var(--green)} .hist .ft{color:var(--red)}
.hk{font-weight:700}
.foot{display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:8px;color:var(--muted);font-size:.82rem;text-align:center}
.disc{max-width:46ch;font-size:.78rem;margin-top:6px}
.disc a{color:var(--muted)}

/* Modos de test */
.modes{display:flex;flex-direction:column;gap:10px}
.mode{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;position:relative}
.mode:not(:disabled):hover{border-color:var(--blue)}
.mode:disabled{opacity:.5;cursor:not-allowed}
.m-n{font-family:var(--f-display);font-weight:800;font-size:1.08rem}
.m-meta{font-family:var(--f-mono);font-size:.76rem;color:var(--muted);align-self:center;text-align:right}
.m-d{grid-column:1/-1;font-size:.9rem;color:var(--muted)}
.m-tag{grid-column:1/-1;justify-self:start;margin-top:6px;font-family:var(--f-display);font-weight:800;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;background:var(--blue);color:var(--card);padding:3px 8px;border-radius:4px}
.m-tag.soft{background:var(--soft-amber);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:.88rem;cursor:pointer}
.chipbtn:hover{border-color:var(--blue)}

/* Por qué fallas */
.cause{background:var(--soft-red);border:2px solid var(--red);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.cause h3{font-size:1.5rem;font-weight:900}
.c-share{font-family:var(--f-mono);font-weight:700;color:var(--red)}
.notice{background:var(--soft-amber);border-radius:10px;padding:10px 12px;color:var(--ink)}
.bar{display:flex;flex-direction:column;gap:4px;cursor:pointer;padding:2px 0}
.bar:hover .brow span{text-decoration:underline}
.brow{display:flex;justify-content:space-between;gap:10px;font-size:.92rem}
.brow b{font-family:var(--f-mono);font-weight:700;font-size:.82rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.btrack{height:9px;background:var(--paper);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.btrack span{display:block;height:100%;background:var(--red);border-radius:5px}
.beh{display:grid;gap:12px}
.beh div{display:grid;grid-template-columns:48px 1fr;gap:0 10px;align-items:baseline}
.beh b{font-family:var(--f-mono);font-size:1.4rem;grid-row:span 2}
.beh span{font-weight:700;font-size:.92rem}
.qd{border-top:1px solid var(--line);padding-top:8px}
.qd summary{display:flex;gap:10px;cursor:pointer;list-style:none;font-size:.92rem}
.qd summary::-webkit-details-marker{display:none}
.qd-w{flex:none;font-family:var(--f-mono);font-weight:700;color:var(--red)}
.qd .fail{margin-top:8px}
.plan ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:10px}
.plan li{padding-left:2px}
.plan li span{display:block;margin-bottom:6px}

/* Temas */
.topic{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0}
.topic summary{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;list-style:none}
.topic summary::-webkit-details-marker{display:none}
.topic[open] summary{border-bottom:1px solid var(--line)}
.topic > :not(summary){margin-left:16px;margin-right:16px}
.topic > :last-child{margin-bottom:14px}
.tn{font-family:var(--f-display);font-weight:800;font-size:1rem}
.pill{flex:none;font-family:var(--f-mono);font-size:.72rem;padding:3px 8px;border-radius:999px;background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.pill.bad{background:var(--soft-red);color:var(--red);border-color:transparent}
.pill.mid{background:var(--soft-amber);color:var(--ink);border-color:transparent}
.pill.good{background:var(--soft-green);color:var(--green);border-color:transparent}
.rules,.traps{margin:12px 0;padding-left:1.1em;display:flex;flex-direction:column;gap:7px;font-size:.95rem}
.traps{color:var(--muted);margin-top:4px}
.topic .eyebrow{margin-top:2px}
.tablewrap{overflow-x:auto;margin-top:10px;margin-bottom:12px}
.ctab{border-collapse:collapse;width:100%;font-size:.9rem}
.ctab th{text-align:left;font-weight:400;color:var(--muted);padding:7px 10px 7px 0;border-bottom:1px solid var(--line);vertical-align:top}
.ctab th{width:46%}
.ctab td{font-family:var(--f-mono);font-weight:700;font-size:.86rem;padding:7px 0;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:break-word}
.about{font-size:.88rem;color:var(--muted);display:flex;flex-direction:column;gap:8px;padding:6px 2px}
.about h3{font-size:.95rem;color:var(--ink)}
.about a{color:var(--blue)}

/* Pestañas inferiores */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{background:none;border:0;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--f-display);font-weight:800;font-size:.72rem;color:var(--muted);cursor:pointer;letter-spacing:.02em}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--blue)}
.tab[aria-current="page"] svg{stroke:var(--blue)}

/* Examen */
.exam{position:fixed;inset:0;z-index:40;background:var(--paper);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.ehead{flex:none;background:var(--card);border-bottom:1px solid var(--line)}
.ehead-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.iconbtn{background:none;border:2px solid var(--line);border-radius:8px;min-width:38px;height:38px;padding:0 8px;cursor:pointer;font-weight:800;font-size:.85rem}
.eh-t{font-family:var(--f-display);font-weight:800;font-size:1rem;line-height:1.2}
.eh-s{font-size:.8rem;color:var(--muted)}
.timer{font-family:var(--f-mono);font-weight:700;font-size:1.25rem;background:var(--paper);border:2px solid var(--line);border-radius:8px;padding:3px 9px;font-variant-numeric:tabular-nums}
.timer.warn{color:var(--red);border-color:var(--red)}
.ebody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ebody-in{max-width:640px;margin:0 auto;padding-block:12px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.ebar{flex:none;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.ebar-in{max-width:640px;margin:0 auto;display:flex;gap:8px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ebar-in .btn{flex:1;padding-inline:8px}
.barhint{flex:1;text-align:center;color:var(--muted);font-size:.9rem;padding:10px 0}
.prog{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.prog span{display:block;height:100%;background:var(--blue)}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;position:relative;box-shadow:var(--shadow)}
.qnum{position:absolute;top:-1px;left:-1px;background:var(--ink);color:var(--card);font-family:var(--f-mono);font-weight:700;font-size:.82rem;padding:3px 9px;border-radius:14px 0 10px 0}
.qtext{font-family:var(--f-body);font-weight:700;font-size:1.15rem;line-height:1.4;margin-top:10px}
.qtext.sm{font-size:1.05rem;margin-top:0}
.signbox{align-self:center;background:var(--signbg);border-radius:12px;padding:10px;border:1px solid var(--line);margin-top:12px}
.sign{width:108px;height:108px;display:block}
.sign.wide{width:220px;height:110px;max-width:100%}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer;font-size:1rem;line-height:1.4}
.opt:not(:disabled):hover{border-color:var(--blue)}
.let{flex:none;width:28px;height:28px;border:2px solid currentColor;border-radius:5px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:.9rem;color:var(--muted)}
.opt.sel{border-color:var(--blue);background:var(--soft-blue)}
.opt.sel .let{background:var(--blue);border-color:var(--blue);color:var(--card)}
.opt.ok{border-color:var(--green);background:var(--soft-green)}
.opt.ok .let{background:var(--green);border-color:var(--green);color:var(--card)}
.opt.ko{border-color:var(--red);background:var(--soft-red)}
.opt.ko .let{background:var(--red);border-color:var(--red);color:var(--card)}
.opt.dim{opacity:.6}
.opt:disabled{cursor:default}
.reveal{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.reveal.good{background:var(--soft-green)} .reveal.bad{background:var(--soft-red)}
.verdict{font-family:var(--f-display);font-weight:900;text-transform:uppercase;letter-spacing:.06em;font-size:.86rem}
.reveal.good .verdict{color:var(--green)} .reveal.bad .verdict{color:var(--red)}
.why{font-size:.95rem}
.chip{display:inline-block;font-family:var(--f-display);font-weight:800;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;background:var(--ink);color:var(--card);padding:2px 7px;border-radius:4px;margin-right:7px;vertical-align:1px}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.gcell{aspect-ratio:1;border:2px solid var(--line);background:var(--card);border-radius:8px;font-family:var(--f-mono);font-weight:700;cursor:pointer}
.gcell.on{background:var(--soft-blue);border-color:var(--blue)}
.gcell.cur{outline:3px solid var(--ink);outline-offset:1px}

/* Vídeo */
.vid{position:relative;border-radius:10px;overflow:hidden;background:#2A2F35;margin-top:12px}
.stage .scene{display:block;width:100%;height:auto}
.vidcover{position:absolute;inset:0;border:0;background:rgba(10,14,18,.62);color:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;padding:12px;text-align:center}
.playbtn{width:56px;height:56px;border-radius:50%;background:#FFFFFF;position:relative;margin-bottom:4px}
.playbtn::after{content:"";position:absolute;left:22px;top:16px;border-left:18px solid #152130;border-top:12px solid transparent;border-bottom:12px solid transparent}
.vc1{font-family:var(--f-display);font-weight:800;font-size:1.05rem}
.vc2{font-size:.82rem;opacity:.9}
.vidbar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#1C1F23;color:#E8ECF0;padding:7px 10px;font-size:.82rem}
.vidbar .btn.ghost{color:#FFFFFF;border-color:#5B6470}

/* Resultado */
.result{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-top:8px}
.stamp{font-family:var(--f-display);font-weight:900;font-size:2.4rem;letter-spacing:.08em;padding:6px 20px;border:5px double currentColor;border-radius:10px;transform:rotate(-6deg);margin:6px 0}
.stamp.apto{color:var(--green)} .stamp.noapto{color:var(--red)}
.rnums{display:flex;gap:22px;justify-content:center;flex-wrap:wrap}
.rnums p{display:flex;flex-direction:column}
.rnums b{font-family:var(--f-mono);font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
.rnums span{font-size:.78rem;color:var(--muted)}
.rcause{font-size:.95rem;max-width:52ch;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left}
.fail{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--red);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.fail .signbox{margin-top:0}
.fail .sign{width:80px;height:80px}
.fail .sign.wide{width:180px;height:90px}
.fq{font-weight:700}
.mine,.good{font-size:.93rem;display:flex;flex-direction:column}
.mine span,.good span{font-family:var(--f-display);font-weight:800;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase}
.mine span{color:var(--red)} .good span{color:var(--green)}

/* Emboscada */
.modal{position:fixed;inset:0;z-index:60;background:rgba(8,12,16,.6);display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;border-top:6px solid var(--red)}
.amb-h{display:flex;gap:12px;align-items:flex-start}
.amb-h .sign{width:54px;height:54px;flex:none}
.amb-h h2{font-size:1.15rem;font-weight:800;margin:2px 0 3px}
.amb-h .muted{font-size:.88rem}
#ambT:focus{outline:none}
.amb-f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
@media (min-width:600px){ .modal{align-items:center} .sheet{border-radius:18px} }

/* Permisos */
.plate-r{flex:none;display:flex}
.plate-p{background:none;border:0;color:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:flex-end;padding:2px 0 2px 10px;font-family:var(--f-display);text-transform:uppercase;line-height:1.1;border-radius:6px}
.plate-p span{font-weight:600;font-size:.7rem;letter-spacing:.08em;opacity:.9}
.plate-p b{font-weight:900;font-size:1.35rem;letter-spacing:.02em;white-space:nowrap}
.plate-p:focus-visible{outline:2px solid var(--plate-ink);outline-offset:2px}
.plabel{flex:none;min-width:46px;height:40px;padding:0 8px;border-radius:7px;background:var(--plate);color:var(--plate-ink);display:inline-grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:1.12rem;letter-spacing:.02em;white-space:nowrap}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.pcard{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;color:var(--ink);font:inherit;min-width:0}
.pcard:hover{border-color:var(--blue)}
.pcard.on{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.pn{font-family:var(--f-display);font-weight:800;font-size:1rem;line-height:1.2}
.pe{font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
.askb{background:var(--card);border:2px solid var(--blue);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.askb h3{font-size:1.15rem;font-weight:800;line-height:1.25}
.permcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.pc-top{display:flex;align-items:center;gap:12px}
.pc-top>div{flex:1;min-width:0}
.pc-top h2{font-size:1.15rem;font-weight:900;line-height:1.15}
.pc-ex{font-size:.86rem;color:var(--muted);line-height:1.3;margin-top:2px}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.step{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;color:var(--ink);font:inherit;font-size:.9rem;font-weight:700;line-height:1.25;min-width:0}
.step b{font-family:var(--f-display);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.step span{font-weight:400;font-size:.78rem;color:var(--muted)}
.step.on{border-color:var(--blue);background:var(--card)}
.step.on b{color:var(--blue)}
.pdl{margin-top:12px;display:grid;gap:8px}
.pdl dt{font-family:var(--f-display);font-weight:800;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pdl dd{margin:0;font-size:.92rem}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--card);padding:10px 16px;border-radius:10px;font-size:.92rem;max-width:calc(100% - 32px)}

@media (prefers-reduced-motion: reduce){ *{scroll-behavior:auto!important} .btn:active{transform:none} }

<script>

const RAW = [

["pri05","pri",1,"excepcion","Intersección sin señalizar: un tranvía se acerca por su izquierda. ¿Quién pasa?",

["pri06","pri",0,"prioridad","Se incorpora a una autovía por el carril de aceleración. ¿Quién tiene prioridad?",

["pri11","pri",0,"prioridad","Un vehículo de urgencia con luz azul y sirena se acerca por detrás. ¿Qué hace?",

["pri12","pri",1,"absoluto","Un vehículo lleva una luz amarilla intermitente en el techo (grúa, obras, transporte especial). ¿Tiene prioridad de paso?",

["pri13","pri",1,"intuicion","En un tramo estrecho de gran pendiente sin señalizar solo cabe un vehículo. ¿Cuál tiene preferencia?",

["pri14","pri",0,"intuicion","Un peatón espera junto a un paso de peatones sin semáforo con intención de cruzar. ¿Qué debe hacer?",

["pri15","pri",1,"novedad","En una calle de plataforma única (calzada y acera al mismo nivel), ¿quién tiene prioridad?",

["amv06","amv",1,"cifra","¿Cuándo pasa un ciclomotor su primera ITV?",
 ["A los 3 años de su matriculación, y después cada 2 años","A los 4 años de su matriculación, y después cada 2 años","Nunca: los ciclomotores están exentos de pasar la ITV"],"Ciclomotor: 3 años y luego cada 2. Las motos: 4 años y luego cada 2."],
["amv07","amv",0,"lectura","¿Necesita seguro obligatorio un ciclomotor?",
 ["Sí, como cualquier vehículo a motor","No, por tener menos de 50 cm³ de cilindrada","Solo si va a llevar pasajero"],"Todo vehículo a motor necesita el seguro obligatorio de responsabilidad civil."],
["amv08","amv",0,"cifra","¿Con cuántos puntos empieza el titular de un permiso AM recién obtenido?",

["amv09","amv",1,"lectura","Tiene 16 años y lleva un año con el permiso AM. Tasa máxima de alcohol en aire espirado:",
 ["0,15 mg/l","0,25 mg/l","0,30 mg/l"],"Durante los 2 años siguientes al primer permiso eres novel: 0,15 mg/l en aire o 0,3 g/l en sangre."],
["amv10","amv",0,"lectura","La placa de matrícula de un ciclomotor empieza por…",
 ["La letra C","La letra M","Un número"],"Las matrículas de ciclomotor empiezan por C."],
["amv11","amv",0,"lectura","¿Cómo sabe si su ciclomotor puede llevar pasajero?",
 ["Por su documentación: debe estar homologado para dos plazas","Porque tenga un asiento largo con espacio para dos personas","Todos los ciclomotores pueden llevar un pasajero"],"No basta con que quepa: la documentación debe indicar dos plazas."],
["amc01","amc",1,"absoluto","¿Puede un ciclomotor circular por una autovía?",
 ["No: está prohibido en autopistas y autovías","Sí, pero solo por el arcén derecho y de día","Sí, a 45 km/h por el carril derecho"],"Ciclomotores fuera de autopistas y autovías. Sin excepciones."],
["amc02","amc",1,"lectura","Fuera de poblado, ¿por dónde debe circular un ciclomotor?",
 ["Por el arcén derecho, si es transitable y suficiente","Por el centro del carril, para que le vean mejor","Por el carril que prefiera, si va a 45 km/h"],"Ciclomotores, bicicletas y otros vehículos lentos usan el arcén derecho si es transitable."],
["amc03","amc",1,"excepcion","¿Pueden circular dos ciclomotores en paralelo por el arcén?",
 ["No: solo las bicicletas pueden ir en columna de a dos","Sí, en columna de a dos, igual que las bicicletas","Sí, siempre que el arcén sea lo bastante ancho"],"La excepción de ir en paralelo es solo para bicicletas. Los ciclomotores, en fila."],
["amc04","amc",1,"lectura","Vía interurbana: quiere girar a la izquierda con su ciclomotor y no hay carril especial. ¿Cómo lo hace?",
 ["Me sitúo a la derecha, fuera de la calzada si puedo, y cruzo cuando sea seguro","Me pego al eje central, señalizo con el intermitente y giro como un coche","Giro directamente desde el arcén, señalizando antes con el brazo izquierdo"],"Los vehículos de dos ruedas lentos esperan a la derecha y cruzan cuando no hay peligro."],
["amc05","amc",1,"cifra","Velocidad máxima de un ciclomotor en una carretera convencional:",
 ["45 km/h","90 km/h","70 km/h"],"45 km/h en cualquier vía. El 90 es para turismos y motos."],
["amc06","amc",0,"absoluto","¿Puede circular agarrado a otro vehículo para que le arrastre?",
 ["No, está prohibido","Sí, en subidas","Sí, a menos de 20 km/h"],"Prohibido agarrarse a otro vehículo."],
["amc07","amc",0,"absoluto","¿Puede circular apoyado en una sola rueda?",

["amc08","amc",1,"novedad","Desde el 1 de octubre de 2026, en ciudad, el conductor de un ciclomotor debe llevar…",

["amc09","amc",0,"novedad","A partir del 1 de octubre de 2027, el casco de los usuarios de ciclomotor…",

["amc10","amc",0,"intuicion","Le adelanta un camión a gran velocidad. ¿Qué debe prever?",

["amc11","amc",0,"intuicion","Circula junto a una fila de coches aparcados. ¿Qué separación lateral conviene dejar?",

["ams01","ams",1,"excepcion","Tiene 16 años y su ciclomotor está homologado para dos plazas. ¿Puede llevar pasajero?",

["ams02","ams",1,"cifra","Como norma general, ¿qué edad mínima debe tener el pasajero de un ciclomotor?",

["ams03","ams",1,"excepcion","Un niño de 9 años puede viajar como pasajero en un ciclomotor…",
 ["Solo si conduce su padre, madre, tutor o un adulto autorizado, y con casco","Nunca: el pasajero de un ciclomotor debe tener al menos 12 años","Siempre que lleve casco homologado y vaya bien sujeto al conductor"],"Entre 7 y 11 años solo con esos conductores. Menos de 7, nunca."],
["ams04","ams",0,"lectura","¿Cómo debe ir sentado el pasajero?",

["ams05","ams",0,"absoluto","¿Es obligatorio el casco en ciclomotor por ciudad?",
 ["Sí, para conductor y pasajero en cualquier vía","Solo fuera de poblado y en las vías rápidas","Solo para los conductores menores de edad"],"Casco siempre, en cualquier vía y para los dos."],
["ams06","ams",1,"lectura","Lleva el casco puesto pero sin abrochar. ¿Es correcto?",
 ["No: equivale a no llevarlo y es infracción","Sí, en trayectos cortos por la ciudad","Solo es infracción en carretera, no en ciudad"],"Desabrochado sale volando en el primer golpe."],
["ams07","ams",0,"cifra","Circular sin casco supone…",

["ams08","ams",0,"intuicion","¿Cómo frena de forma más eficaz con el ciclomotor?",
 ["Usando los dos frenos a la vez, de forma progresiva","Solo con el freno trasero, para no caerse nunca","Solo con el delantero y de golpe, que frena más"],"Los dos frenos, progresivos y con el vehículo recto."],
["ams09","ams",0,"intuicion","Con el suelo mojado, ¿qué zonas son más deslizantes?",
 ["Las marcas viales, las tapas de alcantarilla y las juntas metálicas","El asfalto rugoso y los tramos recién asfaltados con gravilla","Los badenes y las bandas de reducción de velocidad de goma"],"Pintura y metal mojados son hielo para dos ruedas."],
["ams10","ams",0,"novedad","Un repartidor en ciclomotor, durante su jornada, debe llevar…",
 ["Casco y chaleco reflectante en todo momento","Solo casco, y el chaleco reflectante de noche","Nada especial en ciudad durante el día"],"Uso profesional (riders): casco y chaleco siempre, de día y de noche."],
["ams11","ams",0,"novedad","Los guantes de protección en ciclomotor son obligatorios…",

["ams12","ams",0,"intuicion","De noche, ¿qué le hace más visible en el ciclomotor?",
 ["Ropa clara o reflectante y el alumbrado encendido","Ropa oscura, que contrasta con las luces de la calle","Solo la luz de posición, para no deslumbrar a nadie"],"Ver no basta: tienen que verte."],

["mop03","mop",1,"excepcion","Con el A2, ¿puede conducir una moto de 95 kW limitada a 35 kW?",

["mop08","mop",0,"excepcion","Tiene el B desde hace 4 años. ¿Necesita el A1 para conducir en España una moto de 125 cm³ y 11 kW?",

["mop09","mop",1,"lectura","Si ya tiene el permiso B, ¿qué teóricos necesita para el A2?",

["mot01","mot",1,"intuicion","A velocidad media o alta, para inclinar la moto hacia la derecha…",

["mot02","mot",0,"intuicion","En una curva, ¿hacia dónde debe mirar?",

["mot03","mot",1,"lectura","¿Cuándo debe reducir la velocidad para tomar una curva?",

["mot04","mot",0,"intuicion","Postura correcta sobre la moto:",

["mot05","mot",0,"intuicion","Si circula en grupo de motos, la formación recomendada es…",

["mot06","mot",0,"lectura","¿Es buena idea cambiar de marcha en mitad de una curva?",

["mof01","mof",1,"intuicion","Frenando en recta con buen agarre, ¿qué freno aporta más capacidad de frenado?",

["mof02","mof",1,"intuicion","¿Cómo se frena correctamente en moto?",
 ["Con los dos frenos a la vez, de forma progresiva y con la moto recta","Solo con el freno trasero, para no bloquear la rueda delantera","Solo con el delantero y de golpe, que es el que más frena"],"Los dos frenos, progresivos y en recta."],
["mof03","mof",1,"excepcion","Tiene que frenar en plena curva. ¿Qué hace?",
 ["Frenar con mucha suavidad o enderezar antes de frenar fuerte","Usar el freno delantero a fondo sin enderezar la moto","Soltar el gas y apretar el embrague hasta salir de la curva"],"Inclinado, la rueda tiene poco agarre para frenar. Primero endereza."],
["mof04","mof",0,"intuicion","Frenada de emergencia en una moto con ABS:",
 ["Frenar a fondo con los dos frenos y mantener la presión","Bombear los frenos para que no se bloqueen las ruedas","Usar solo el trasero para que la moto no se levante"],"El ABS hace el trabajo de no bloquear. Tú frenas a fondo."],
["mof05","mof",0,"lectura","Con lluvia, en moto…",

["mof06","mof",0,"lectura","Va a viajar con pasajero y equipaje. ¿Y la presión de los neumáticos?",

["mof07","mof",0,"intuicion","La cadena de transmisión…",

["moe01","moe",1,"novedad","Los guantes de protección en moto, desde el 1 de octubre de 2026…",
 ["Son obligatorios en vías interurbanas para conductor y pasajero","Solo son obligatorios para el conductor y solo en autopista","Solo son obligatorios en invierno o cuando llueve"],"Guantes en interurbanas, calzado cerrado en cualquier vía."],
["moe02","moe",1,"novedad","¿Puede ir en moto por ciudad con sandalias?",

["moe03","moe",1,"excepcion","Edad mínima del pasajero de una moto:",
 ["12 años, o 7 si conduce su padre, madre, tutor o un adulto autorizado","16 años, o 12 si conduce su padre, madre, tutor o un adulto autorizado","Cualquier edad, siempre que lleve casco de su talla y vaya sujeto"],"Por debajo de 7, nunca."],
["moe04","moe",0,"lectura","¿Dónde no puede ir nunca el pasajero?",

["moe05","moe",0,"intuicion","¿Qué tipo de casco ofrece más protección?",

["moe06","moe",0,"intuicion","Su casco ha sufrido un golpe fuerte pero no se ven grietas. ¿Qué hace?",

["moe07","moe",0,"lectura","¿Qué ropa le hace más visible?",

["moe08","moe",0,"intuicion","Con pasajero, la moto…",

["moe09","moe",0,"lectura","En las curvas, el pasajero debe…",

["moc01","moc",1,"novedad","Retención en autopista en un tramo señalizado para que las motos usen el arcén. ¿A qué velocidad máxima?",

["moc02","moc",1,"intuicion","Circula detrás de un camión. ¿Dónde se coloca?",

["moc03","moc",1,"intuicion","Un coche que viene de frente va a girar a la izquierda cruzando su trayectoria. ¿Qué hace?",
 ["Contar con que no me haya visto: reduzco y me preparo para frenar","Mantener la velocidad: tengo prioridad y me tiene que ver","Acelerar para pasar antes de que inicie el giro"],"Es el accidente de moto más típico. Tener razón no te salva."],
["moc04","moc",0,"intuicion","Va a adelantar a un camión con viento lateral. ¿Qué debe prever?",

["moc05","moc",0,"lectura","En ciudad, ¿qué posición en el carril es mejor?",
 ["Una desde la que vea y me vean, lejos de ángulos muertos y de las puertas","Pegado al bordillo derecho, para dejar sitio a los coches","Sobre la línea que separa los carriles, para avanzar entre ellos"],"Visible y con escapatoria."],
["moc06","moc",0,"cifra","Velocidad máxima genérica de una moto en autovía:",

["moc07","moc",0,"intuicion","¿Cansa más conducir una moto que un coche?",
 ["Sí: frío, viento y postura cansan antes; hay que parar más","No: cansa menos porque se va más atento a la carretera","Igual, si la moto tiene carenado y un asiento cómodo"],"La fatiga en moto llega antes y se nota menos."],
["moc08","moc",1,"novedad","Adelanta en moto a un ciclista fuera de poblado. ¿Qué normas se aplican?",
 ["Las mismas: al menos 20 km/h menos que el límite y 1,5 m","Puedo pasar más cerca, porque la moto es más estrecha","Basta con tocar el claxon y pasar sin reducir"],"La regla de octubre de 2026 vale para cualquier vehículo que adelante."],
["moc09","moc",0,"lectura","La luz de cruce en moto, de día…",
 ["Es obligatoria en todo momento","Solo es obligatoria en carretera","Solo es obligatoria con lluvia"],"Moto: luz de cruce siempre encendida."],
["mof08","mof",0,"intuicion","En una moto sin ABS, la rueda delantera se bloquea al frenar. ¿Qué hace?",

["moe10","moe",0,"lectura","Además del casco, guantes y calzado, ¿qué equipamiento se recomienda?",
 ["Chaqueta y pantalón de moto con protecciones","Ninguno: con casco, guantes y calzado basta","Solo un chaleco reflectante sobre la ropa normal"],"En una caída, el asfalto se come la ropa normal en segundos."],

/* ---------- PRIORIDAD ---------- */

["pri23","pri",1,"intuicion","Gira a la izquierda y un grupo de ciclistas viene de frente por la calzada. ¿Qué hace?",

["pri25","pri",0,"lectura","¿Qué vehículos se consideran prioritarios cuando van en servicio de urgencia?",

["ade21","ade",1,"lectura","Va a girar a la izquierda en una vía de doble sentido. ¿Dónde se coloca?",

["ade28","ade",0,"lectura","¿Dónde debe hacer un cambio de sentido?",

/* ===== SEÑALES (SVG) Y ESCENAS DE VÍDEO ===== */

function signSVG(spec) {
  const [type, arg] = String(spec).split(":");
  const wrap = (inner, vb = "0 0 100 100", label = "Señal") =>
    `<svg class="sign" viewBox="${vb}" role="img" aria-label="${label}">${inner}</svg>`;
  const txt = (s, size, fill, y = 50) =>
    `<text x="50" y="${y}" text-anchor="middle" dominant-baseline="central" font-family="Overpass, Arial, sans-serif" font-weight="800" font-size="${size}" fill="${fill}">${s}</text>`;
  switch (type) {
    case "stop": {
      const pts = [];
      for (let i = 0; i < 8; i++) {
        const a = Math.PI / 8 + i * Math.PI / 4;
        pts.push((50 + 46 * Math.cos(a)).toFixed(1) + "," + (50 + 46 * Math.sin(a)).toFixed(1));
      }
      const inner = pts.map(p => { const [x, y] = p.split(",").map(Number); return (50 + (x - 50) * 0.9).toFixed(1) + "," + (50 + (y - 50) * 0.9).toFixed(1); });
      return wrap(`<polygon points="${pts.join(" ")}" fill="#FFFFFF"/><polygon points="${inner.join(" ")}" fill="#C62828"/>${txt("STOP", 25, "#FFFFFF")}`, undefined, "Señal de STOP");
    }
    case "ceda":
      return wrap(`<polygon points="10,16 90,16 50,88" fill="#FFFFFF" stroke="#C62828" stroke-width="9" stroke-linejoin="round"/>`, undefined, "Ceda el paso");
    case "limit":
      return wrap(`<circle cx="50" cy="50" r="44" fill="#FFFFFF" stroke="#C62828" stroke-width="10"/>${txt(arg, 36, "#111111", 52)}`, undefined, "Velocidad máxima " + arg);
    case "fin":
      return wrap(`<defs><clipPath id="cfin"><circle cx="50" cy="50" r="43"/></clipPath></defs><circle cx="50" cy="50" r="44" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>${txt(arg, 36, "#9A9A9A", 52)}<g clip-path="url(#cfin)" stroke="#222222" stroke-width="3">${[-24, -12, 0, 12, 24].map(o => `<line x1="${8 + o}" y1="${92 + o}" x2="${92 + o}" y2="${8 + o}"/>`).join("")}</g>`, undefined, "Fin de limitación de velocidad " + arg);
    case "min":
      return wrap(`<circle cx="50" cy="50" r="45" fill="#1F5DB8"/><circle cx="50" cy="50" r="40" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>${txt(arg, 36, "#FFFFFF", 52)}`, undefined, "Velocidad mínima " + arg);
    case "obras":
      return wrap(`<polygon points="50,10 92,86 8,86" fill="#F6C400" stroke="#C62828" stroke-width="8" stroke-linejoin="round"/><rect x="46" y="36" width="8" height="28" rx="2" fill="#111111"/><circle cx="50" cy="73" r="4.5" fill="#111111"/>`, undefined, "Señal de obras");
    case "peligro":
      return wrap(`<polygon points="50,10 92,86 8,86" fill="#FFFFFF" stroke="#C62828" stroke-width="8" stroke-linejoin="round"/><rect x="46" y="36" width="8" height="28" rx="2" fill="#111111"/><circle cx="50" cy="73" r="4.5" fill="#111111"/>`, undefined, "Peligro");
    case "prior":
      return wrap(`<g transform="rotate(45 50 50)"><rect x="18" y="18" width="64" height="64" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/><rect x="29" y="29" width="42" height="42" fill="#F6C400"/></g>`, undefined, "Calzada con prioridad");
    case "dirprohib":
      return wrap(`<circle cx="50" cy="50" r="45" fill="#C62828"/><rect x="18" y="42" width="64" height="16" fill="#FFFFFF"/>`, undefined, "Dirección prohibida");
    case "circprohib":
      return wrap(`<circle cx="50" cy="50" r="42" fill="#FFFFFF" stroke="#C62828" stroke-width="10"/>`, undefined, "Circulación prohibida");
    case "semaforo":
      return wrap(`<rect x="8" y="26" width="84" height="48" rx="10" fill="#1E1E1E"/><circle cx="31" cy="50" r="15" fill="#FF3B30"/><circle cx="69" cy="50" r="15" fill="#5A1A17"/><g stroke="#FF3B30" stroke-width="3" stroke-linecap="round"><line x1="31" y1="18" x2="31" y2="10"/><line x1="12" y1="22" x2="7" y2="16"/><line x1="50" y1="22" x2="55" y2="16"/></g>`, undefined, "Luces rojas intermitentes");
    case "carril":
      if (arg === "aspa")
        return wrap(`<rect x="10" y="10" width="80" height="80" rx="8" fill="#151515"/><g stroke="#FF3B30" stroke-width="11" stroke-linecap="round"><line x1="30" y1="30" x2="70" y2="70"/><line x1="70" y1="30" x2="30" y2="70"/></g>`, undefined, "Aspa roja de carril");
      return wrap(`<rect x="10" y="10" width="80" height="80" rx="8" fill="#151515"/><g stroke="#FFC400" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"><line x1="30" y1="30" x2="66" y2="66"/><polyline points="44,68 68,68 68,44"/></g>`, undefined, "Flecha oblicua de carril");
    case "lineas":
      return `<svg class="sign wide" viewBox="0 0 220 110" role="img" aria-label="Línea continua y discontinua adosadas"><rect x="0" y="0" width="220" height="110" rx="8" fill="#4A5058"/><rect x="0" y="50" width="220" height="3" fill="#FFFFFF"/>${Array.from({length:9},(_,i)=>`<rect x="${i*26}" y="57" width="16" height="3" fill="#FFFFFF"/>`).join("")}<g transform="translate(70 84)"><rect x="-20" y="-10" width="40" height="20" rx="5" fill="#1F5DB8"/><rect x="6" y="-8" width="8" height="16" rx="2" fill="#A9C6F0"/></g><text x="104" y="89" font-family="Overpass, Arial, sans-serif" font-weight="800" font-size="13" fill="#FFFFFF">USTED →</text><text x="12" y="30" font-family="Overpass, Arial, sans-serif" font-weight="600" font-size="12" fill="#D8DDE3">← sentido contrario</text></svg>`;
    /* ---- Ampliación de señales ---- */
    case "noadel": case "finadel": {
      const fin = type === "finadel";
      const car = (cx, col) => `<g fill="${col}" transform="translate(${cx} 52) scale(1.35) translate(${-cx} -52)"><path d="M${cx - 8},50 L${cx - 6},41 Q${cx - 5.5},39 ${cx - 3.5},39 L${cx + 3.5},39 Q${cx + 5.5},39 ${cx + 6},41 L${cx + 8},50 Z"/><rect x="${cx - 11}" y="49" width="22" height="11" rx="3"/><rect x="${cx - 10}" y="59" width="5" height="5" rx="1"/><rect x="${cx + 5}" y="59" width="5" height="5" rx="1"/></g>`;
      if (!fin) return wrap(`<circle cx="50" cy="50" r="44" fill="#FFFFFF" stroke="#C62828" stroke-width="10"/>${car(33, "#C62828")}${car(67, "#111111")}`, undefined, "Adelantamiento prohibido");
      return wrap(`<defs><clipPath id="cfa"><circle cx="50" cy="50" r="43"/></clipPath></defs><circle cx="50" cy="50" r="44" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>${car(33, "#A8A8A8")}${car(67, "#A8A8A8")}<g clip-path="url(#cfa)" stroke="#222222" stroke-width="3">${[-24, -12, 0, 12, 24].map(o => `<line x1="${8 + o}" y1="${92 + o}" x2="${92 + o}" y2="${8 + o}"/>`).join("")}</g>`, undefined, "Fin de la prohibición de adelantar");
    }
    case "fintodas":
      return wrap(`<defs><clipPath id="cft"><circle cx="50" cy="50" r="43"/></clipPath></defs><circle cx="50" cy="50" r="44" fill="#FFFFFF" stroke="#222222" stroke-width="2"/><g clip-path="url(#cft)" stroke="#222222" stroke-width="3">${[-24, -12, 0, 12, 24].map(o => `<line x1="${8 + o}" y1="${92 + o}" x2="${92 + o}" y2="${8 + o}"/>`).join("")}</g>`, undefined, "Fin de prohibiciones");
    case "noestac": case "noparar": {
      const bars = type === "noestac" ? `<line x1="20" y1="20" x2="80" y2="80"/>` : `<line x1="20" y1="20" x2="80" y2="80"/><line x1="80" y1="20" x2="20" y2="80"/>`;
      return wrap(`<defs><clipPath id="c${type}"><circle cx="50" cy="50" r="40"/></clipPath></defs><circle cx="50" cy="50" r="44" fill="#1F5DB8" stroke="#C62828" stroke-width="10"/><g clip-path="url(#c${type})" stroke="#C62828" stroke-width="10">${bars}</g>`, undefined, type === "noestac" ? "Estacionamiento prohibido" : "Parada y estacionamiento prohibidos");
    }
    case "nogiro": {
      const d = arg === "izq" ? "M58,76 L58,52 Q58,40 46,40 L36,40" : "M42,76 L42,52 Q42,40 54,40 L64,40";
      const head = arg === "izq" ? "38,30 24,40 38,50" : "62,30 76,40 62,50";
      return wrap(`<circle cx="50" cy="50" r="44" fill="#FFFFFF" stroke="#C62828" stroke-width="10"/><path d="${d}" fill="none" stroke="#111111" stroke-width="9"/><polygon points="${head}" fill="#111111"/><line x1="20" y1="20" x2="80" y2="80" stroke="#C62828" stroke-width="8"/>`, undefined, arg === "izq" ? "Giro a la izquierda prohibido" : "Giro a la derecha prohibido");
    }

function lerpKF(kf, t) {
  if (t <= kf[0][0]) return kf[0];
  for (let i = 1; i < kf.length; i++) {
    if (t <= kf[i][0]) {
      const a = kf[i - 1], b = kf[i], u = (t - a[0]) / (b[0] - a[0] || 1);
      const e = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
      const k = (a === kf[0] && kf.length === 2) ? u : e;
      return [t, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k, (a[3] || 0) + ((b[3] || 0) - (a[3] || 0)) * k];
    }
  }
  return kf[kf.length - 1];
}

function sceneMarkup(name, t) {
  const sc = SCENES[name];
  const acts = sc.actors.map((a, i) => {
    const p = lerpKF(a.kf, t);
    return `<g data-a="${i}" transform="translate(${p[1].toFixed(1)} ${p[2].toFixed(1)}) rotate(${(p[3] || 0).toFixed(1)})">${a.g}</g>`;
  }).join("");
  return `<svg class="scene" viewBox="0 0 400 240" role="img" aria-label="Escena de tráfico vista desde arriba">${sc.bg()}${acts}</svg>`;
}

function playScene(host, name, onEnd) {
  const sc = SCENES[name];
  host.innerHTML = sceneMarkup(name, 0);
  const svg = host.querySelector("svg");
  const groups = Array.from(svg.querySelectorAll("g[data-a]"));
  const blinks = Array.from(svg.querySelectorAll(".bl"));
  const t0 = performance.now();
  let raf = 0, stopped = false;
  function frame(now) {
    if (stopped) return;
    const t = Math.min(sc.dur, (now - t0) / 1000);
    sc.actors.forEach((a, i) => {
      if (a.kf.length < 2) return;
      const p = lerpKF(a.kf, t);
      groups[i].setAttribute("transform", `translate(${p[1].toFixed(1)} ${p[2].toFixed(1)}) rotate(${(p[3] || 0).toFixed(1)})`);
    });
    const on = Math.floor(t / 0.35) % 2 === 0;
    blinks.forEach(b => b.setAttribute("opacity", on ? "1" : "0.15"));
    if (t < sc.dur) raf = requestAnimationFrame(frame);
    else { stopped = true; onEnd && onEnd(); }
  }
  raf = requestAnimationFrame(frame);
  return () => { stopped = true; cancelAnimationFrame(raf); };
}

const failRecs = () => Object.entries(S.q).filter(([id, r]) => r.w > 0 && BYID[id] && inPool(id));
const reds = () => failRecs().filter(([, r]) => r.b === 0);
const ambers = () => failRecs().filter(([, r]) => r.b > 0 && r.b < 3);
function dueList() {
  const now = Date.now();
  return failRecs().filter(([id, r]) => r.b < 3 && r.due <= now && !BYID[id].scene)
    .sort((a, b) => a[1].b - b[1].b || a[1].due - b[1].due).map(([id]) => id);
}
function themeStats() {
  const E = EXc(), st = {};
  E.themes.forEach(t => st[t] = { s: 0, w: 0, n: POOL().filter(q => q.t === t).length });
  Object.entries(S.q).forEach(([id, r]) => { const q = BYID[id]; if (q && st[q.t] && inPool(id)) { st[q.t].s += r.s; st[q.t].w += r.w; } });
  return st;
}
function readiness() {
  const E = EXc(), N = E.diag, lim = E.fails - 1;
  const dd = diagDone(), last5 = exams().slice(-5), nRed = reds().length;
  const nov = TPOOL().filter(q => q.k === "novedad");
  const novOk = nov.filter(q => S.q[q.id] && S.q[q.id].c > 0).length;
  const crit = [
    { ok: dd >= N, t: `Diagnóstico completo (${Math.min(dd, N)} de ${N})` },
    { ok: last5.length === 5 && last5.every(t => t.fails <= lim), t: `Últimos 5 tests con ${plural(lim, "fallo", "fallos")} o menos` },
    { ok: xTests().length > 0 && nRed === 0, t: nRed ? `Sin preguntas en rojo (tienes ${nRed})` : "Sin preguntas en rojo" }
  ];
  if (nov.length) crit.push({ ok: novOk === nov.length, t: `Normas nuevas acertadas al menos una vez (${novOk} de ${nov.length})` });
  const avg = last5.length ? last5.reduce((a, t) => a + t.fails, 0) / last5.length : 99;
  let level = "rojo";
  if (crit.every(c => c.ok)) level = "verde";
  else if (dd >= N && avg <= E.fails) level = "ambar";
  const title = level === "verde" ? "Listo para examen" : level === "ambar" ? "Casi, pero no te firmo" : "Todavía no";
  const sub = level === "verde" ? "Cumples todo lo que exijo. Mantén un simulacro al día hasta el examen."
    : level === "ambar" ? "Apruebas a veces. Yo quiero que apruebes siempre, con margen."
    : dd < N ? "Primero el diagnóstico. Sin datos no hay método." : "Tus últimos tests no pasan mi listón.";
  return { level, crit, title, sub, avg, dd, nRed, N, E };
}

/* ---------- Construcción de tests ---------- */
function pickLeast(pool, n, ex) {
  const arr = shuffle(pool.filter(q => !ex.has(q.id)));
  arr.sort((a, b) => seen(a.id) - seen(b.id));
  const out = arr.slice(0, n); out.forEach(q => ex.add(q.id)); return out.map(q => q.id);
}
function dueFailed(n, ex, maxBox = 2) {
  const out = failRecs().filter(([id, r]) => r.b < maxBox && !BYID[id].scene && !ex.has(id))
    .sort((a, b) => a[1].b - b[1].b || b[1].w - a[1].w || a[1].due - b[1].due).slice(0, n).map(([id]) => id);
  out.forEach(id => ex.add(id)); return out;
}
function withVideo(ids, ex) {
  const v = pickLeast(VIDEOS, 1, ex)[0];
  const pos = 3 + ((Math.random() * (ids.length - 3)) | 0);
  ids.splice(pos, 0, v); return ids;
}
function buildDiag() {
  const E = EXc(), ex = new Set(), n = E.q - (E.video ? 1 : 0), T = TPOOL();
  let ids = dueFailed(Math.round(n / 5), ex);
  ids = ids.concat(pickLeast(T.filter(q => q.f === 1), n - ids.length, ex));
  if (ids.length < n) ids = ids.concat(pickLeast(T, n - ids.length, ex));
  ids = shuffle(ids);
  return E.video ? withVideo(ids, ex) : ids;
}
function buildSim() {
  const E = EXc(), ex = new Set(), n = E.q - (E.video ? 1 : 0), T = TPOOL();
  let ids = dueFailed(Math.round(n * 0.27), ex);
  ids = ids.concat(pickLeast(T.filter(q => q.k === "novedad"), E.q >= 30 ? 3 : 2, ex));
  const ts = themeStats();
  const weak = {}; E.themes.forEach(t => weak[t] = (ts[t].w + 1) / (ts[t].s + 3));
  const capN = Math.ceil(n / 4);
  const cap = {}; ids.forEach(id => { const t = BYID[id].t; cap[t] = (cap[t] || 0) + 1; });
  let cand = T.filter(q => !ex.has(q.id));
  while (ids.length < n && cand.length) {
    const ws = cand.map(q => (cap[q.t] || 0) >= capN ? 0 : (weak[q.t] || 0.3) * (q.f ? 1.3 : 1) / (1 + seen(q.id)));
    const tot = ws.reduce((a, b) => a + b, 0);
    let i = 0;
    if (tot <= 0) i = (Math.random() * cand.length) | 0;
    else { let r = Math.random() * tot; while (i < ws.length - 1 && r > ws[i]) { r -= ws[i]; i++; } if (!ws[i]) i = ws.findIndex(w => w > 0); }
    const q = cand[i]; ids.push(q.id); ex.add(q.id); cap[q.t] = (cap[q.t] || 0) + 1; cand.splice(i, 1);
  }
  ids = shuffle(ids);
  return E.video ? withVideo(ids, ex) : ids;
}
function rankForPractice(pool) {
  const score = q => { const r = S.q[q.id]; if (!r) return 2; if (r.w > 0 && r.b === 0) return 0; return 1 + (r.c / (r.s || 1)) + r.b * 0.1; };
  return shuffle(pool.slice()).sort((a, b) => score(a) - score(b) || seen(a.id) - seen(b.id));
}
function buildMode(mode) {
  const [m, arg] = mode.split(":");
  const E = EXc();
  if (m === "diag") { const n = diagDone() + 1; return { kind: "diag", n, title: `Diagnóstico ${n} de ${E.diag}`, ids: buildDiag(), fb: "end", limit: E.min * MIN }; }
  if (m === "sim") return { kind: "sim", title: "Simulacro", ids: buildSim(), fb: "end", limit: E.min * MIN };
  if (m === "repaso") {
    const ids = failRecs().filter(([id, r]) => r.b < 3).sort((a, b) => a[1].b - b[1].b || b[1].w - a[1].w).slice(0, 20).map(([id]) => id);
    return { kind: "repaso", title: "Repaso de fallos", ids, fb: "instant" };
  }
  if (m === "cifras") return { kind: "cifras", title: "Ráfaga de cifras", ids: rankForPractice(TPOOL().filter(q => q.k === "cifra")).slice(0, 12).map(q => q.id), fb: "instant" };
  if (m === "nov") return { kind: "nov", title: "Normas nuevas", ids: rankForPractice(TPOOL().filter(q => q.k === "novedad")).slice(0, 12).map(q => q.id), fb: "instant" };
  if (m === "riesgo") return { kind: "riesgo", title: "Percepción del riesgo", ids: shuffle(VIDEOS.map(v => v.id)), fb: "instant" };
  if (m === "tema") {
    const pool = POOL().filter(q => q.t === arg);
    return { kind: "tema", title: THEMES[arg].n, ids: rankForPractice(pool).slice(0, 10).map(q => q.id), fb: "instant" };
  }
  if (m === "trampa") {
    const failed = failRecs().filter(([id]) => BYID[id].k === arg).sort((a, b) => b[1].w - a[1].w).map(([id]) => id);
    const extra = rankForPractice(POOL().filter(q => q.k === arg && !failed.includes(q.id))).map(q => q.id);
    return { kind: "trampa", title: "Trampa: " + TRAPS[arg].n, ids: failed.concat(extra).slice(0, 12), fb: "instant" };
  }
  if (m === "ids") return { kind: "repaso", title: "Repaso de este test", ids: arg.split(",").filter(id => BYID[id]), fb: "instant" };
  return null;
}

/* ---------- Ejecución de un test ---------- */
let RUN = null, stopVid = null;
function startRun(mode) {
  const cfg = buildMode(mode);
  if (!cfg || !cfg.ids.length) { toast("No hay preguntas para este modo todavía."); return; }
  closeModal();
  cfg.x = curX(); cfg.pl = PL().l;
  RUN = Object.assign(cfg, {
    items: cfg.ids.map(id => ({ id, order: shuffle([0, 1, 2]), sel: -1, hist: [], ms: 0, views: 0, done: false, ok: null })),
    i: 0, t0: Date.now(), shown: performance.now(), tid: 0, confirmFinish: false, confirmQuit: false, result: null, grid: false
  });
  $("#exam").hidden = false; document.body.classList.add("lock");
  if (RUN.limit) RUN.tid = setInterval(tick, 1000);
  renderRun(); tick();
}
function curItem() { return RUN.items[RUN.i]; }
function stopVideo() { if (stopVid) { stopVid(); stopVid = null; } }
function account() { const it = curItem(); if (it && !(RUN.fb === "instant" && it.done)) { it.ms += performance.now() - RUN.shown; } RUN.shown = performance.now(); }
function goto(i) { if (!RUN || i < 0 || i >= RUN.items.length) return; stopVideo(); account(); RUN.i = i; RUN.grid = false; RUN.confirmFinish = false; renderRun(); $("#examBodyWrap").scrollTop = 0; }
function tick() {
  if (!RUN || !RUN.limit || RUN.result) return;
  const left = Math.max(0, RUN.limit - (Date.now() - RUN.t0));
  const el = $("#timer");
  if (el) { const m = Math.floor(left / 60000), s = Math.floor((left % 60000) / 1000); el.textContent = `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`; el.classList.toggle("warn", left < 5 * MIN); }
  if (left <= 0) finishRun(true);
}
function quitRun() { stopVideo(); clearInterval(RUN && RUN.tid); RUN = null; $("#exam").hidden = true; document.body.classList.remove("lock"); renderView(); setTimeout(() => maybeAmbush("tab"), 600); }

function signHTML(q) { return q.img ? `<div class="signbox">${signSVG(q.img)}</div>` : ""; }
function optsHTML(q, it, reveal) {
  return `<div class="opts">${it.order.map((orig, pos) => {
    let cls = "opt";
    if (reveal) { if (orig === 0) cls += " ok"; else if (pos === it.sel) cls += " ko"; else cls += " dim"; }
    else if (pos === it.sel) cls += " sel";
    return `<button class="${cls}" data-act="pick" data-pos="${pos}" ${reveal ? "disabled" : ""} aria-pressed="${pos === it.sel}"><span class="let">${LET[pos]}</span><span class="otx">${esc(q.o[orig])}</span></button>`;
  }).join("")}</div>`;
}
function videoHTML(q, it) {
  const left = 3 - it.views;
  const poster = sceneMarkup(q.scene, SCENES[q.scene].poster);
  return `<div class="vid"><div class="stage" id="stage">${poster}</div>
    ${it.views === 0 ? `<button class="vidcover" data-act="play"><span class="playbtn" aria-hidden="true"></span><span class="vc1">Haga clic para ver el vídeo</span><span class="vc2">Le quedan 3 visualizaciones antes de ver la pregunta</span></button>`
      : `<div class="vidbar"><span>${left > 0 ? plural(left, "visualización restante", "visualizaciones restantes") : "Sin visualizaciones restantes"}</span>${left > 0 ? `<button class="btn ghost sm" data-act="play">Ver de nuevo</button>` : ""}</div>`}</div>`;
}
function revealHTML(q, it) {
  const r = S.q[q.id] || {};
  const note = it.ok ? okLine() : behaviourNote(it, r);
  return `<div class="reveal ${it.ok ? "good" : "bad"}"><p class="verdict">${it.ok ? "Correcta" : "Fallo"}</p>
    <p class="why"><span class="chip">${esc(TRAPS[q.k].n)}</span>${esc(q.e)}</p>${note ? `<p class="hand">${esc(note)}</p>` : ""}</div>`;
}
function okLine() { const a = ["Bien. Que no se te suba.", "Correcta. Ahora acierta también la siguiente.", "Así sí.", "Bien leída.", "Esa ya no te pilla. De momento."]; return a[(Math.random() * a.length) | 0]; }
function behaviourNote(it, r) {
  const ms = it.ansMs != null ? it.ansMs : it.ms;
  const s = Math.round(ms / 1000);
  if (it.sel >= 0 && ms < 6000) return `Respondiste en ${s} s. Ni el radar de tramo va tan rápido: lee la pregunta entera.`;
  if (it.flipped) return "Tenías la buena y la cambiaste. Tu primera respuesta sabía más que tú.";
  if (ms > 45000) return `${s} s dudando. Si dudas tanto, no lo sabes: a la chuleta del tema.`;
  if (r.w >= 2) return `Ya van ${r.w} fallos en esta. Ya no es despiste: apúntatela.`;
  return "";
}

function renderRun() {
  const R = RUN; if (!R) return;
  if (R.result) return renderResult();
  const it = curItem(), q = BYID[it.id], isV = !!q.scene;
  const answered = R.items.filter(x => x.sel >= 0).length;
  const instantDone = R.fb === "instant" && it.done;
  $("#examHead").innerHTML = `
    <button class="iconbtn" data-act="quit" aria-label="Salir del test">${R.confirmQuit ? "¿Salir? Se pierde" : "✕"}</button>
    <div class="eh-mid"><p class="eh-t">${esc(R.title)}</p><p class="eh-s">${R.fb === "end" ? `${esc(R.pl)} · ` : ""}Pregunta ${R.i + 1} de ${R.items.length}</p></div>
    ${R.limit ? `<p class="timer" id="timer" aria-label="Tiempo restante">${String(R.limit / MIN).padStart(2, "0")}:00</p>` : `<p class="eh-s">${plural(R.items.filter(x => x.done && !x.ok).length, "fallo", "fallos")}</p>`}`;
  const prog = `<div class="prog"><span style="width:${((R.i + 1) / R.items.length * 100).toFixed(1)}%"></span></div>`;
  let body = prog;
  if (R.grid) {
    body += `<div class="grid">${R.items.map((x, i) => `<button class="gcell ${x.sel >= 0 ? "on" : ""} ${i === R.i ? "cur" : ""}" data-act="jump" data-i="${i}">${i + 1}</button>`).join("")}</div>`;
  } else {
    body += `<article class="qcard"><p class="qnum">${R.i + 1}</p>`;
    if (isV) body += videoHTML(q, it);
    if (!isV || it.views > 0) {
      body += signHTML(q) + `<h2 class="qtext">${esc(q.q)}</h2>` + optsHTML(q, it, instantDone);
      if (instantDone) body += revealHTML(q, it);
    }
    body += `</article>`;
  }
  $("#examBody").innerHTML = body;
  let bar = "";
  if (R.fb === "end") {
    let last = R.i === R.items.length - 1;
    const unans = R.items.length - answered;
    if (R.grid) last = true;
    bar = `<button class="btn ghost" data-act="prev" ${R.i === 0 ? "disabled" : ""}>Anterior</button>
      <button class="btn ghost" data-act="grid">${R.grid ? "Volver" : "Índice"}</button>
      ${last || R.confirmFinish ? `<button class="btn primary" data-act="finish">${R.confirmFinish && unans ? `Quedan ${unans} en blanco. Corregir igual` : "Corregir examen"}</button>` : `<button class="btn primary" data-act="next">Siguiente</button>`}`;
  } else {
    bar = instantDone ? `<button class="btn primary wide" data-act="cont">${R.i === R.items.length - 1 ? "Ver resultado" : "Siguiente"}</button>`
      : `<p class="barhint">${isV && it.views === 0 ? "Mira el vídeo para ver la pregunta" : "Elige una respuesta"}</p>`;

}
function pick(pos) {
  const R = RUN, it = curItem(); if (!R || R.result) return;
  const q = BYID[it.id];
  if (q.scene && it.views === 0) return;
  if (R.fb === "instant") {
    if (it.done) return;
    it.sel = pos; it.ms += performance.now() - R.shown; R.shown = performance.now();
    it.ok = it.order[pos] === 0; it.done = true; it.flipped = false; it.ansMs = it.ms;
    record(it.id, it.ok, it.order[pos], it.ms, false); save();
  } else {
    if (it.sel >= 0 && it.sel !== pos) it.hist.push(it.sel);
    it.sel = pos;
  }
  renderRun();
}
function contRun() {
  const R = RUN;
  if (R.i < R.items.length - 1) goto(R.i + 1);

}
function finishRun(auto) {
  const R = RUN; if (!R || R.result) return;
  stopVideo(); account(); clearInterval(R.tid);
  let res;
  if (R.fb === "end") {
    res = R.items.map(it => {
      const orig = it.sel < 0 ? -1 : it.order[it.sel];
      const ok = orig === 0;
      it.ok = ok; it.flipped = !ok && it.hist.some(p => it.order[p] === 0);
      record(it.id, ok, orig, it.ms, it.flipped);
      return { id: it.id, ok, orig, it };
    });
  } else {
    res = R.items.filter(it => it.done).map(it => ({ id: it.id, ok: it.ok, orig: it.order[it.sel], it }));
  }
  const fails = res.filter(r => !r.ok);
  const entry = { kind: R.kind, x: R.x, n: R.n || 0, ts: Date.now(), total: res.length, fails: fails.length, ids: fails.map(r => r.id), dur: Date.now() - R.t0, blank: res.filter(r => r.orig < 0).length };
  if (res.length) { S.tests.push(entry); S.done[R.x] = (S.done[R.x] || 0) + 1; trimTests(); }
  save();
  R.result = { res, entry, auto };
  renderResult();
}
function verdictLine(f, m) {
  if (f === 0) return "Cero fallos. Me fastidia no tener nada que corregir. Repítelo mañana para ver si es método o suerte.";
  if (f < m) return `${f === 1 ? "Un fallo" : f + " fallos"}. APTO con margen. Así sí. Pero un día bueno no es un método: quiero cinco seguidos.`;
  if (f === m) return `APTO por los pelos. Para la DGT vale; para mí, ${m} fallos es jugar a la ruleta.`;
  if (f <= m + 2) return `NO APTO con ${f}. Te has quedado a nada, y a nada se queda también el que se sale en la curva.`;
  if (f <= m + 6) return `NO APTO con ${f}. Con esto no te dejo ni arrancar en el garaje. Repaso de fallos antes de otro test.`;
  return `NO APTO con ${f}. Esto no es un test, es una declaración de intenciones. Volvemos a la chuleta.`;
}
function renderResult() {
  const R = RUN, { res, entry, auto } = R.result;
  const f = entry.fails, isExam = R.fb === "end", maxF = EXAMS[R.x || "comun"].fails;
  const apto = f <= maxF;
  $("#examHead").innerHTML = `<button class="iconbtn" data-act="quit" aria-label="Cerrar">✕</button><div class="eh-mid"><p class="eh-t">${esc(R.title)}</p><p class="eh-s">Resultado${auto ? " · tiempo agotado" : ""}</p></div><span></span>`;
  const byK = {}; res.filter(r => !r.ok).forEach(r => { const k = BYID[r.id].k; byK[k] = (byK[k] || 0) + 1; });
  const topK = Object.entries(byK).sort((a, b) => b[1] - a[1])[0];
  let h = `<section class="result">`;
  if (isExam) h += `<div class="stamp ${apto ? "apto" : "noapto"}" role="img" aria-label="${apto ? "Apto" : "No apto"}">${apto ? "APTO" : "NO APTO"}</div>`;
  h += `<div class="rnums"><p><b>${f}</b><span>${f === 1 ? "fallo" : "fallos"}</span></p><p><b>${entry.total - f}</b><span>aciertos</span></p><p><b>${Math.floor(entry.dur / 60000)}:${String(Math.floor(entry.dur % 60000 / 1000)).padStart(2, "0")}</b><span>tiempo</span></p>${entry.blank ? `<p><b>${entry.blank}</b><span>en blanco</span></p>` : ""}</div>`;
  h += `<p class="hand big">${esc(isExam ? verdictLine(f, maxF) : f === 0 ? "Todas bien. Pasa a la siguiente tanda." : `${plural(f, "fallo", "fallos")} en ${entry.total}. Esas vuelven a por ti en forma de emboscada.`)}</p>`;
  if (topK && f >= 2) h += `<p class="rcause">Patrón de hoy: <b>${esc(TRAPS[topK[0]].n)}</b> (${topK[1]} de ${f}). ${esc(TRAPS[topK[0]].d)}</p>`;
  h += `</section>`;
  const fl = res.filter(r => !r.ok);
  if (fl.length) {
    h += `<h3 class="sec">Tus fallos, uno a uno</h3>`;
    h += fl.map(r => failCard(BYID[r.id], r.orig, r.it)).join("");
  }
  $("#examBody").innerHTML = h;
  $("#examBar").innerHTML = `${fl.length ? `<button class="btn ghost" data-act="start" data-mode="ids:${fl.map(r => r.id).join(",")}">Repasar estos fallos</button>` : ""}<button class="btn primary" data-act="quit">Terminar</button>`;
  $("#examBodyWrap").scrollTop = 0;
}
function failCard(q, orig, it) {
  const r = S.q[q.id] || {};
  const note = it ? behaviourNote(it, r) : "";
  return `<article class="fail">${signHTML(q)}<p class="fq">${esc(q.q)}</p>
    <p class="mine"><span>Marcaste</span>${orig < 0 ? "En blanco (cuenta como fallo)" : esc(q.o[orig])}</p>
    <p class="good"><span>Correcta</span>${esc(q.o[0])}</p>

}

/* ---------- Emboscadas ---------- */
let AMB = null;
function maybeAmbush(reason) {

  if (!xTests().length) return;
  if (Date.now() - (S.lastAmb || 0) < 4 * MIN) return;
  const due = dueList(); if (!due.length) return;
  if (reason !== "load" && Math.random() > 0.45) return;

}
function openAmbush(id) {
  const r = S.q[id];
  AMB = { id, it: { id, order: shuffle([0, 1, 2]), sel: -1, done: false, ok: null, ms: 0 }, t0: performance.now(), lf: r ? r.lf || r.lt : 0, w: r ? r.w : 0 };
  S.lastAmb = Date.now(); save();
  renderAmbush(); $("#modal").hidden = false;
  setTimeout(() => { const h = $("#ambT"); if (h) h.focus({ preventScroll: true }); }, 50);
}
function renderAmbush() {
  const q = BYID[AMB.id], it = AMB.it;
  const more = dueList().filter(x => x !== AMB.id).length;

  const E = EXc(), th = E.themes.filter(t => ts[t] && ts[t].n);
  const t1 = th.filter(t => THEMES[t].tier === 1), t2 = th.filter(t => THEMES[t].tier === 2);
  const cif = CIFRAS_EX[curX()] || CIFRAS;
  let h = `<h2 class="vt">Temas</h2><p class="muted small">${esc(E.n)} · permiso ${esc(PL().l)}</p>
  ${permInfoHTML()}
  <details class="topic cifras" open><summary><span class="tn">Tabla de cifras</span><span class="pill">imprescindible</span></summary><div class="tablewrap"><table class="ctab"><tbody>${cif.map(([a, b]) => `<tr><th scope="row">${esc(a)}</th><td>${esc(b)}</td></tr>`).join("")}</tbody></table></div><button class="btn primary sm" data-act="start" data-mode="cifras">Ráfaga de cifras</button></details>
  <h3 class="sec">Los que más caen</h3>${t1.map(card).join("")}
  ${t2.length ? `<h3 class="sec">Si te sobra tiempo</h3>${t2.map(card).join("")}` : ""}
  <section class="about"><h3>Sobre estas preguntas</h3>
  <p>Las ha redactado el profe al estilo del examen con la normativa vigente: la reforma del Reglamento General de Circulación (RD 518/2026, en vigor desde el 1 de octubre de 2026), la V-16 obligatoria y, para camión y autobús, los tiempos de conducción del Reglamento (CE) 561/2006. No son el banco oficial de la DGT, que no es público, y esta app no está afiliada a la DGT ni a ningún organismo público.</p>
  <p>El orden de los temas es el peso que suelen tener en el examen, no una estadística oficial. Confirma con tu autoescuela el formato de tu prueba antes de presentarte.</p>
  <p>Fuentes: <a href="https://www.dgt.es/comunicacion/notas-de-prensa/20260930-reforma-del-reglamento-de-circulacion-usuarios-vulnerables/" target="_blank" rel="noopener">DGT, reforma del Reglamento</a> · <a href="https://www.dgt.es/comunicacion/noticias/20251020-examen-teorico-la-importancia-de-conocer-el-riesgo" target="_blank" rel="noopener">DGT, vídeo de riesgo en el examen</a></p></section>`;
  return h + footHTML();
}

/* ---------- Avisos ---------- */
let toastT = 0;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

/* ---------- Eventos ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act],[data-go]");
  if (!b || b.disabled) return;
  if (b.dataset.go) { go(b.dataset.go); return; }
  const a = b.dataset.act;
  if (a !== "reset" && resetArm) { resetArm = false; }
  switch (a) {
    case "start": startRun(b.dataset.mode); break;
    case "pick": if (AMB && b.closest("#sheet")) ambPick(+b.dataset.pos); else pick(+b.dataset.pos); break;
    case "prev": goto(RUN.i - 1); break;
    case "next": goto(RUN.i + 1); break;
    case "grid": account(); RUN.grid = !RUN.grid; renderRun(); break;
    case "jump": goto(+b.dataset.i); break;
    case "cont": contRun(); break;
    case "finish": {
      const unans = RUN.items.filter(x => x.sel < 0).length;
      if (unans && !RUN.confirmFinish) { RUN.confirmFinish = true; renderRun(); }
      else finishRun(false);
      break;
    }
    case "quit":
      if (RUN.result || RUN.fb === "instant" && !RUN.items.some(x => x.done)) { quitRun(); break; }
      if (RUN.fb === "instant") { finishRun(false); break; }
      if (!RUN.confirmQuit) { RUN.confirmQuit = true; renderRun(); setTimeout(() => { if (RUN && !RUN.result) { RUN.confirmQuit = false; renderRun(); } }, 3500); }
      else quitRun();
      break;
    case "play": {
      const it = curItem(), q = BYID[it.id];
      if (it.views >= 3) break;
      const host = $("#stage"); if (!host) break;
      const cover = $(".vidcover"); if (cover) cover.remove();
      const vb = $(".vidbar"); if (vb) vb.innerHTML = `<span>Reproduciendo…</span>`;
      stopVideo();
      stopVid = playScene(host, q.scene, () => { stopVid = null; it.views++; renderRun(); });
      break;
    }
    case "amb-next": { const d = dueList().filter(x => x !== AMB.id); AMB = null; if (d.length) openAmbush(d[0]); else closeModal(); break; }
    case "amb-close": closeModal(); break;
    case "perm": PENDING = null; go("perm"); break;
    case "setperm": {
      const p = b.dataset.p;
      if (PERMITS[p].askB) { PENDING = p; renderView(); window.scrollTo(0, 0); break; }
      PENDING = null; S.perm = p; S.hasB = null; S.ex = ""; curX(); save(); go("home");
      break;
    }
    case "setb": S.perm = PENDING; S.hasB = b.dataset.v === "1"; S.ex = ""; PENDING = null; curX(); save(); go("home"); break;
    case "setex": S.ex = b.dataset.x; save(); renderView(); break;
    case "reset":
      if (!resetArm) { resetArm = true; renderView(); setTimeout(() => { if (resetArm) { resetArm = false; renderView(); } }, 4000); }
      else { resetArm = false; S = blank(); save(); go("perm"); toast("Progreso borrado. Desde cero."); }
      break;
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.matches(".bar[data-act]")) { e.target.click(); return; }
  if (!RUN || RUN.result || e.target.matches("input,textarea")) return;
  const k = e.key.toLowerCase();
  const map = { a: 0, b: 1, c: 2, "1": 0, "2": 1, "3": 2 };
  if (k in map) { pick(map[k]); e.preventDefault(); }
  else if (e.key === "ArrowRight" && RUN.fb === "end") goto(RUN.i + 1);
  else if (e.key === "ArrowLeft" && RUN.fb === "end") goto(RUN.i - 1);
});
document.addEventListener("change", e => {
  if (e.target.id === "examDate") { if (!S.dates) S.dates = {}; S.dates[curX()] = e.target.value || ""; save(); const c = $("#countdown"); if (c) c.innerHTML = countdownHTML(); }
});
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") maybeAmbush("tab"); });

/* Enlace directo a un permiso desde la web: ?p=B, ?p=C… */
(function () {
  if (typeof location === "undefined") return;
  const p = new URLSearchParams(location.search).get("p");
  if (p && history.replaceState) { try { history.replaceState(null, "", location.pathname); } catch (e) {} }
  if (!p || !PERMITS[p] || S.perm === p) return;
  if (PERMITS[p].askB) { PENDING = p; VIEW = "perm"; return; }
  S.perm = p; S.hasB = null; S.ex = ""; curX(); save(); VIEW = "home";
})();
go(VIEW);
initRemote();
maybeAmbush("load");

</script>
